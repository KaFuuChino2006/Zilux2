<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <!-- 与真实 app 相同的字体：app.css 里有同名 @font-face，独立预览页需要自带一份。 -->
    <link rel="preload" href="/fonts/zilux2-sans-sc-regular.ttf" as="font" type="font/ttf" crossorigin />
    <title>Zilux2 · Room Preview</title>
    <style>
      @font-face {
        font-family: 'Zilux2 Sans SC';
        src: url('/fonts/zilux2-sans-sc-regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      /* 只做「独立预览页」的外壳样式：真正画面全部由 roomScene 自己注入 scoped CSS。 */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      /* 提示词约定：root 放进 width:100vw;height:100vh 的容器，且容器不设 padding。 */
      #stage {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        padding: 0;
        margin: 0;
      }
      /* ?debug=1 才创建，极简调试角标，方便肉眼核对时间/行号。 */
      #debug-badge {
        position: fixed;
        left: 10px;
        top: 10px;
        z-index: 2147483647;
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.62);
        color: #d8fff3;
        font: 12px/1.45 Consolas, "Cascadia Mono", monospace;
        letter-spacing: 0.02em;
        pointer-events: none;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="./src/dev/roomPreview.ts"></script>
  </body>
</html>
