<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <!-- 与真实 app 相同的字体：app.css 里有同名 @font-face，独立预览页需要自带一份。 -->
    <link rel="preload" href="/fonts/zilux2-sans-sc-regular.ttf" as="font" type="font/ttf" crossorigin />
    <title>Zilux2 · Metro Preview</title>
    <style>
      @font-face {
        font-family: 'Zilux2 Sans SC';
        src: url('/fonts/zilux2-sans-sc-regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      /* 独立预览页外壳：地图、浮层与交互全部由 metroStage / metroRender 注入到 #stage 里。 */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* 先用日间纸色打底，避免模块加载前黑屏闪一下（对应 metroTheme 的 --mt-paper）。 */
        background: #f4efe6;
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        padding: 0;
        margin: 0;
      }
      #debug-badge {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 2147483647;
        display: none;
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(20, 16, 12, 0.62);
        color: #ffe6bf;
        font: 12px/1.45 Consolas, 'Cascadia Mono', monospace;
        letter-spacing: 0.02em;
        pointer-events: none;
        white-space: pre;
      }
      /* 默认隐藏；dev 脚本写进内容后自动显示。
         这样即使脚本用 `badge.style.display = ''` 复位（回落到样式表），角标也能出现。 */
      #debug-badge:not(:empty) {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="debug-badge"></div>
    <script type="module" src="./src/dev/metroPreview.ts"></script>
  </body>
</html>
